<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Premium — Gestor de Tareas</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts: Inter para un look moderno y limpio -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="splash-screen" class="splash-screen">
        <div class="loader-large"></div>
    </div>
    <div class="glass-background"></div>
    
    <main class="app-container">
        <header class="app-header">
            <div class="logo">
                <div class="loader"></div>
                <h1>TaskFlow</h1>
            </div>
            <p class="subtitle">Gestión inteligente de tareas</p>
        </header>

        <section class="input-card">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="¿Qué necesitas hacer hoy?" maxlength="80">
                <select id="statusSelect">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Proceso">En Proceso</option>
                    <option value="Completada">Completada</option>
                </select>
                <button id="addBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </section>

        <nav class="filter-nav">
            <button class="filter-btn active" data-filter="Todas">Todas</button>
            <button class="filter-btn" data-filter="Pendiente">Pendientes</button>
            <button class="filter-btn" data-filter="En Proceso">En Proceso</button>
            <button class="filter-btn" data-filter="Completada">Completadas</button>
        </nav>

        <section class="list-section">
            <ul id="taskList">
                <!-- Las tareas se inyectan aquí -->
            </ul>
        </section>

        <footer class="app-footer">
            <div class="stats">
                <span id="taskCount">0</span> tareas en total
            </div>
            <p>© 2026 • Programación Web para Ciencia de Datos • Diego Diaz Montero</p>
        </footer>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
